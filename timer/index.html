<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>シンプルタイマー</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>シンプルタイマー</h1>

    <div class="display" id="display" aria-live="polite">00:00:00</div>

    <form class="inputs" id="inputs" aria-label="時間設定">
      <label>
        時
        <input type="number" id="hours" min="0" max="23" value="0" inputmode="numeric" />
      </label>
      <label>
        分
        <input type="number" id="minutes" min="0" max="59" value="5" inputmode="numeric" />
      </label>
      <label>
        秒
        <input type="number" id="seconds" min="0" max="59" value="0" inputmode="numeric" />
      </label>
    </form>

    <div class="controls">
      <button id="startBtn" type="button" class="primary">スタート</button>
      <button id="pauseBtn" type="button" disabled>一時停止</button>
      <button id="resetBtn" type="button">リセット</button>
    </div>

    <p class="status" id="status"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
